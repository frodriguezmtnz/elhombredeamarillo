    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    <script>
      var anim = null
      var data = window.NEON_LOTTIE
      var stage = document.getElementById('stage')
      var spot = document.getElementById('spot')
      var fxMode = 'spotlight'

      function showFallback(msg) {
        document.getElementById('fallback').classList.add('on')
        document.getElementById('meta').textContent = 'fallback CSS'
        if (msg) document.getElementById('err').textContent = msg
      }

      function boot() {
        if (typeof lottie === 'undefined') { showFallback('lottie-web no cargó (¿sin red?).'); return }
        if (!data) { showFallback('JSON no inyectado: ejecuta pnpm neon:lottie'); return }
        if (anim) anim.destroy()
        anim = lottie.loadAnimation({
          container: document.getElementById('lottie'),
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: JSON.parse(JSON.stringify(data)),
        })
        anim.setSpeed(parseFloat(document.getElementById('selSpeed').value))
        anim.addEventListener('DOMLoaded', function () {
          document.getElementById('meta').textContent =
            data.layers.length + ' capas · ' + data.op + 'f @ ' + data.fr + 'fps · ' + data.w + '×' + data.h + ' · SVG renderer'
        })
        anim.addEventListener('data_failed', function () { showFallback('lottie falló al parsear el JSON') })
      }

      /* ─── efectos de cursor (spotlight / tilt / combo; inline para file://) ─── */
      var px = -9999, py = -9999, sx = -9999, sy = -9999
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
      stage.addEventListener('pointermove', function (e) {
        var r = stage.getBoundingClientRect()
        px = e.clientX - r.left; py = e.clientY - r.top
      })
      stage.addEventListener('pointerleave', function () { px = -9999; py = -9999 })
      function frame() {
        requestAnimationFrame(frame)
        sx += (px - sx) * 0.16; sy += (py - sy) * 0.16
        var on = !reduce && (fxMode === 'spotlight' || fxMode === 'combo') && px > -999
        spot.classList.toggle('on', on)
        if (on) {
          spot.style.setProperty('--sx', sx + 'px')
          spot.style.setProperty('--sy', sy + 'px')
        }
        if (anim && !reduce) {
          var r = stage.getBoundingClientRect()
          var tilt = fxMode === 'tilt' || fxMode === 'combo'
          if (tilt && px > -999) {
            var nx = (px - r.width / 2) / (r.width / 2)
            var ny = (py - r.height / 2) / (r.height / 2)
            anim.renderer.svgRoot.style.transform =
              'perspective(900px) rotateY(' + (nx * 7).toFixed(2) + 'deg) rotateX(' + (-ny * 7).toFixed(2) + 'deg)'
          } else {
            anim.renderer.svgRoot.style.transform = ''
          }
        }
      }
      requestAnimationFrame(frame)

      function setFx(m) { fxMode = m; document.getElementById('selFx').value = m }
      document.getElementById('selFx').onchange = function (e) { setFx(e.target.value) }
      document.getElementById('btnLoop').onclick = function () { if (anim) { anim.loop = true; anim.play() } mark(this) }
      document.getElementById('btnOnce').onclick = function () { if (anim) { anim.loop = false; anim.goToAndPlay(0, true) } mark(this) }
      document.getElementById('btnStatic').onclick = function () { if (anim) { anim.goToAndStop(40, true); anim.pause() } this.classList.toggle('active') }
      document.getElementById('btnReload').onclick = function () { boot() }
      document.getElementById('selSpeed').onchange = function (e) { if (anim) anim.setSpeed(parseFloat(e.target.value)) }
      function mark(btn) { document.getElementById('btnLoop').classList.toggle('active', btn.id === 'btnLoop'); document.getElementById('btnOnce').classList.toggle('active', btn.id === 'btnOnce') }

      /* la comparativa controla vía postMessage (sin acceso cross-frame, compatible file://) */
      window.addEventListener('message', function (e) {
        var d = e.data || {}
        if (d.neonFx && !document.getElementById('selFx').querySelector('option[value=' + d.neonFx + ']').disabled) setFx(d.neonFx)
        if (d.neonReplay) boot()
        if (typeof d.neonStatic === 'boolean') { var b = document.getElementById('btnStatic'); if (b.classList.contains('active') !== d.neonStatic) b.click() }
      })

      if (reduce) { document.getElementById('btnStatic').classList.add('active') }
      boot()
      if (reduce && anim) { anim.goToAndStop(40, true); anim.pause() }
    </script>
