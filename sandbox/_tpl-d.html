<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neón Trivial — Opción D (solo FromVille)</title>
    <style>
/*__NEON_CSS__*/
    </style>
  </head>
  <body>
    <div id="wrap">
      <header>
        <h1>Neón Trivial — Opción D · solo FromVille</h1>
        <span class="tag">solo texto rojo · fondo transparente · limpio y centrado</span>
      </header>

      <div id="stage" class="v-d">
        <span class="bg-label">#juego · fondo</span>
        <div id="sign">
          <div class="line line-fv" data-word="FromVille"></div>
        </div>
        <div id="spot"></div>
      </div>

      <div id="controls">
        <label>Efecto cursor
          <select id="selFx">
            <option value="off">Sin efecto</option>
            <option value="spotlight" selected>Foco que sigue al cursor</option>
            <option value="tilt">Inclinación 3D (parallax)</option>
            <option value="magnetic">Letras magnéticas</option>
            <option value="combo">Combo: foco + inclinación</option>
          </select>
        </label>
        <button id="btnReplay">Volver a encender</button>
        <button id="btnStatic">Reduced-motion (estático)</button>
      </div>
      <p class="hint">Mínimo: solo la palabra. Ideal si quieres el neón encima de una imagen o del propio tablero sin más decoración.</p>
    </div>

    <script>
/*__NEON_JS__*/
    </script>
  </body>
</html>
