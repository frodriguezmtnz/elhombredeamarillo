<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bottle Tree — Playground (FROM)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070805;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .lil-gui {
        --lil-gui--width: 300px;
        --lil-gui--background-color: rgba(12, 13, 10, 0.9);
        --lil-gui--text-color: #f1ebdc;
        --lil-gui--widget-color: #1a1c13;
        --lil-gui--number-color: #e4b722;
        --lil-gui--title-background-color: #212318;
        --lil-gui--focus-color: #e4b722;
      }
      #overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.78);
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #overlay.open {
        display: flex;
      }
      #overlayBox {
        width: min(90vw, 640px);
      }
      #exportOut {
        width: 100%;
        height: 320px;
        box-sizing: border-box;
        background: #0c0d0a;
        color: #f1ebdc;
        font: 12px/1.5 'JetBrains Mono', monospace;
        border: 1px solid #212318;
        border-radius: 8px;
        padding: 12px;
        resize: none;
      }
      #overlayActions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        justify-content: flex-end;
      }
      #overlayActions button {
        min-width: 90px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #212318;
        background: #1a1c13;
        color: #f1ebdc;
        font: 600 12px 'JetBrains Mono', monospace;
        cursor: pointer;
      }
      #overlayActions button:hover {
        border-color: #e4b722;
        color: #e4b722;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay">
      <div id="overlayBox">
        <textarea id="exportOut" readonly spellcheck="false"></textarea>
        <div id="overlayActions">
          <button id="copyBtn">Copiar</button>
          <button id="closeBtn">Cerrar</button>
        </div>
      </div>
    </div>
    <script type="module">
      import * as THREE from 'https://esm.sh/three@0.185.1';
      import GUI from 'https://esm.sh/lil-gui@0.20.0';
      import { GLTFExporter } from 'https://esm.sh/three@0.185.1/examples/jsm/exporters/GLTFExporter.js';

      const DEFAULTS = {
        seed: 1337,
        ambientIntensity: 17.8,
        hemisphereIntensity: 0.75,
        moonIntensity: 3.75,
        warmIntensity: 39.5,
        holeIntensity: 16.5,
        cameraDistance: 7.7,
        cameraHeight: 5.3,
        lookAtY: 3.1,
        orbitSpeed: 0.27,
        fov: 57,
        offsetX: 0.5,
        branchCount: 8,
        swayAmp: 2,
        swaySpeed: 1.8,
        fogDensity: 0.062,
      };

      const params = { ...DEFAULTS };

      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      let rng = mulberry32(params.seed);

      const app = document.getElementById('app');

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      app.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const fog = new THREE.FogExp2(0x070805, params.fogDensity);
      scene.fog = fog;

      const camera = new THREE.PerspectiveCamera(
        params.fov,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );

      const ambient = new THREE.AmbientLight(0x5a5442, params.ambientIntensity);
      scene.add(ambient);

      const hemisphere = new THREE.HemisphereLight(0x887766, 0x0c0d0a, params.hemisphereIntensity);
      scene.add(hemisphere);

      const moon = new THREE.DirectionalLight(0x8899bb, params.moonIntensity);
      moon.position.set(4, 7, -3);
      scene.add(moon);

      const warmLight = new THREE.PointLight(0xf4c943, params.warmIntensity, 15, 2);
      warmLight.position.set(0.6, 2.4, 1.6);
      scene.add(warmLight);

      const root = new THREE.Group();
      root.position.x = params.offsetX;
      scene.add(root);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(20, 48),
        new THREE.MeshStandardMaterial({ color: 0x0b0c09, roughness: 1 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.01;
      root.add(ground);

      const bottles = [];
      let treeGroup = null;
      let holeLight = null;
      let cameraAngle = Math.PI * 0.2;

      function buildTree() {
        const group = new THREE.Group();

        const barkMat = new THREE.MeshStandardMaterial({
          color: 0x2b2015,
          roughness: 0.95,
          metalness: 0.05,
        });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0x3a2c1c, roughness: 0.9 });

        const trunkSegments = [
          { y: 0.9, r: 0.42, h: 1.9, rx: 0.02, rz: 0.03 },
          { y: 2.12, r: 0.33, h: 0.5, rx: 0.03, rz: -0.02 },
          { y: 3.0, r: 0.27, h: 0.55, rx: -0.02, rz: 0.04 },
          { y: 3.85, r: 0.21, h: 1.25, rx: 0.04, rz: -0.03 },
          { y: 4.75, r: 0.16, h: 1.2, rx: 0.05, rz: -0.04 },
        ];
        for (const seg of trunkSegments) {
          const mesh = new THREE.Mesh(
            new THREE.CylinderGeometry(seg.r * 0.85, seg.r, seg.h, 10),
            barkMat,
          );
          mesh.position.y = seg.y;
          mesh.rotation.x = seg.rx;
          mesh.rotation.z = seg.rz;
          group.add(mesh);
        }

        const holeY = 2.62;
        const tunnel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.26, 0.26, 0.55, 12, 1, true),
          new THREE.MeshStandardMaterial({
            color: 0x0a0906,
            roughness: 1,
            side: THREE.DoubleSide,
          }),
        );
        tunnel.position.y = holeY;
        group.add(tunnel);

        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.045, 10, 24), rimMat);
        rim.position.y = holeY;
        rim.rotation.x = Math.PI / 2;
        group.add(rim);

        const builtHoleLight = new THREE.PointLight(0xf4c943, params.holeIntensity, 4, 2);
        builtHoleLight.position.set(0.25, holeY, 0.35);
        group.add(builtHoleLight);

        const branchCount = params.branchCount;
        for (let i = 0; i < branchCount; i++) {
          const attachY = 1.7 + (i / branchCount) * 2.6;
          const angle = (i / branchCount) * Math.PI * 2 + (i % 2 ? 0.35 : -0.25);
          const tiltUp = 0.3 + rng() * 0.45;
          const len = 1.15 + rng() * 0.9;

          const start = new THREE.Vector3(0, attachY, 0);
          const end = new THREE.Vector3(
            Math.sin(angle) * Math.cos(tiltUp) * len,
            attachY + Math.sin(tiltUp) * len,
            Math.cos(angle) * Math.cos(tiltUp) * len,
          );

          group.add(cylinderBetween(start, end, 0.055, barkMat));

          if (i % 2 === 0) {
            const subStart = start.clone().lerp(end, 0.7);
            const subEnd = subStart
              .clone()
              .addScaledVector(new THREE.Vector3(0.3, 1, 0).normalize(), 0.55);
            group.add(cylinderBetween(subStart, subEnd, 0.032, barkMat));
          }

          const attach = end.clone();
          attach.y += 0.05;
          const bottle = createBottle(attach);
          bottles.push(bottle);
          group.add(bottle);
        }

        return { group, holeLight: builtHoleLight };
      }

      function createBottle(attach) {
        const group = new THREE.Group();
        group.position.copy(attach);

        const ropeLen = 0.65 + rng() * 0.5;
        const rope = new THREE.Mesh(
          new THREE.CylinderGeometry(0.014, 0.014, ropeLen, 6),
          new THREE.MeshStandardMaterial({ color: 0x1a1c12, roughness: 0.8 }),
        );
        rope.position.y = -ropeLen / 2;
        group.add(rope);

        const palette = [0x2f6b43, 0x8a6a2f, 0x3a5f7a, 0x6b3a3a, 0x4f6b2f, 0x7a5a4a];
        const color = palette[Math.floor(rng() * palette.length)];

        const glassMat = new THREE.MeshPhongMaterial({
          color,
          specular: 0xcbbf9a,
          shininess: 110,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide,
          depthWrite: false,
        });

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.7, 12), glassMat);
        body.position.y = -(ropeLen + 0.35);
        group.add(body);

        const shoulder = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.15, 0.32, 12),
          glassMat,
        );
        shoulder.position.y = -(ropeLen + 0.85);
        group.add(shoulder);

        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 0.28, 10), glassMat);
        neck.position.y = -(ropeLen + 1.14);
        group.add(neck);

        group.userData.sway = {
          phase: rng() * Math.PI * 2,
          amp: 0.035 + rng() * 0.06,
          speed: 0.7 + rng() * 0.9,
        };

        return group;
      }

      function cylinderBetween(a, b, radius, material) {
        const dir = b.clone().sub(a);
        const len = dir.length();
        const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 8), material);
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        return mesh;
      }

      function disposeGroup(group) {
        group.traverse((obj) => {
          if (obj.isMesh) {
            obj.geometry.dispose();
            const material = obj.material;
            if (Array.isArray(material)) {
              for (const m of material) m.dispose();
            } else {
              material.dispose();
            }
          }
        });
      }

      function rebuildTree() {
        if (treeGroup) {
          root.remove(treeGroup);
          disposeGroup(treeGroup);
        }
        bottles.length = 0;
        rng = mulberry32(params.seed);
        const built = buildTree();
        treeGroup = built.group;
        holeLight = built.holeLight;
        root.add(treeGroup);
      }

      rebuildTree();

      const timer = new THREE.Timer();
      timer.connect(document);

      function animate(timestamp) {
        requestAnimationFrame(animate);
        timer.update(timestamp);
        const dt = timer.getDelta();
        const t = timer.getElapsed();

        for (const bottle of bottles) {
          const sway = bottle.userData.sway;
          bottle.rotation.x =
            Math.sin(t * sway.speed * params.swaySpeed + sway.phase) * sway.amp * params.swayAmp;
          bottle.rotation.z =
            Math.cos(t * sway.speed * 0.85 * params.swaySpeed + sway.phase * 1.4) *
            sway.amp *
            params.swayAmp;
        }

        cameraAngle += dt * params.orbitSpeed;
        camera.position.set(
          Math.sin(cameraAngle) * params.cameraDistance + params.offsetX,
          params.cameraHeight,
          Math.cos(cameraAngle) * params.cameraDistance,
        );
        camera.lookAt(params.offsetX, params.lookAtY, 0);

        warmLight.intensity = params.warmIntensity + Math.sin(t * 0.5) * 8;
        if (holeLight) holeLight.intensity = params.holeIntensity + Math.sin(t * 0.8) * 3;

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function exportGLB() {
        const exporter = new GLTFExporter();
        exporter.parse(
          scene,
          (result) => {
            const blob = new Blob([result], { type: 'model/gltf-binary' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'bottle-tree.glb';
            link.click();
            URL.revokeObjectURL(link.href);
          },
          (error) => console.error(error),
          { binary: true },
        );
      }

      function exportSettings() {
        const data = JSON.stringify(params, null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(data).catch(() => {});
        }
        const blob = new Blob([data], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'bottle-tree-settings.json';
        link.click();
        URL.revokeObjectURL(link.href);
        document.getElementById('exportOut').value = data;
        document.getElementById('overlay').classList.add('open');
      }

      function resetSettings() {
        Object.assign(params, DEFAULTS);
        gui.updateDisplay();
        root.position.x = params.offsetX;
        fog.density = params.fogDensity;
        rebuildTree();
      }

      function randomizeSeed() {
        params.seed = Math.floor(Math.random() * 1000000000) + 1;
        gui.updateDisplay();
        rebuildTree();
      }

      document.getElementById('copyBtn').addEventListener('click', () => {
        const out = document.getElementById('exportOut');
        out.select();
        out.setSelectionRange(0, 999999);
        document.execCommand('copy');
        const btn = document.getElementById('copyBtn');
        btn.textContent = '¡Copiado!';
        setTimeout(() => (btn.textContent = 'Copiar'), 1500);
      });
      document.getElementById('closeBtn').addEventListener('click', () => {
        document.getElementById('overlay').classList.remove('open');
      });

      const gui = new GUI({ title: 'Bottle Tree — Controles' });

      const lightFolder = gui.addFolder('Luz');
      lightFolder.add(params, 'ambientIntensity', 0, 20, 0.05).name('Ambient').onChange((v) => {
        ambient.intensity = v;
      });
      lightFolder.add(params, 'hemisphereIntensity', 0, 3, 0.05).name('Hemisférica').onChange((v) => {
        hemisphere.intensity = v;
      });
      lightFolder.add(params, 'moonIntensity', 0, 10, 0.05).name('Luna').onChange((v) => {
        moon.intensity = v;
      });
      lightFolder.add(params, 'warmIntensity', 0, 80, 0.5).name('Cálida (base)').onChange((v) => {
        warmLight.intensity = v;
      });
      lightFolder.add(params, 'holeIntensity', 0, 30, 0.5).name('Brillo agujero').onChange((v) => {
        if (holeLight) holeLight.intensity = v;
      });

      const cameraFolder = gui.addFolder('Cámara');
      cameraFolder.add(params, 'cameraDistance', 3, 10, 0.1).name('Distancia');
      cameraFolder.add(params, 'cameraHeight', 1, 6, 0.1).name('Altura');
      cameraFolder.add(params, 'lookAtY', 0, 4, 0.1).name('Punto de mira Y');
      cameraFolder.add(params, 'orbitSpeed', 0, 0.3, 0.005).name('Velocidad órbita');
      cameraFolder.add(params, 'fov', 30, 75, 1).name('FOV').onChange((v) => {
        camera.fov = v;
        camera.updateProjectionMatrix();
      });

      const treeFolder = gui.addFolder('Árbol / Botellas');
      treeFolder.add(params, 'offsetX', -4, 6, 0.1).name('Offset X (derecha)').onChange((v) => {
        root.position.x = v;
      });
      treeFolder
        .add(params, 'branchCount', 4, 16, 1)
        .name('Ramas / botellas')
        .onFinishChange(rebuildTree);
      treeFolder.add(params, 'swayAmp', 0, 3, 0.05).name('Balanceo (amplitud x)');
      treeFolder.add(params, 'swaySpeed', 0, 3, 0.05).name('Balanceo (velocidad x)');

      const fogFolder = gui.addFolder('Atmósfera');
      fogFolder.add(params, 'fogDensity', 0, 0.15, 0.002).name('Niebla').onChange((v) => {
        fog.density = v;
      });

      const seedFolder = gui.addFolder('Semilla');
      seedFolder.add(params, 'seed', 1, 999999999, 1).name('Semilla').onFinishChange(rebuildTree);
      seedFolder.add({ randomizeSeed }, 'randomizeSeed').name('Randomizar semilla');

      const adjustFolder = gui.addFolder('Ajustes');
      adjustFolder.add({ exportSettings }, 'exportSettings').name('Exportar JSON');
      adjustFolder.add({ resetSettings }, 'resetSettings').name('Reset');

      const exportFolder = gui.addFolder('Exportar');
      exportFolder.add({ exportGLB }, 'exportGLB').name('Descargar GLB');
    </script>
  </body>
</html>
