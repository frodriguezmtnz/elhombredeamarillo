server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /icons/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /sw.js {
        expires 0;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
