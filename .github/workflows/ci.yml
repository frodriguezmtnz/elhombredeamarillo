name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck THE ROAD
        run: pnpm typecheck:road

      - name: Smoke THE ROAD
        run: pnpm --filter the-road smoke

      # Réplica exacta del build de Vercel: juego + sitio + copia a dist/the-road
      - name: Build
        run: pnpm build:road && pnpm build && node scripts/copy-road.mjs

      - name: Validate OpenSpec (informativo)
        continue-on-error: true
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          npx -y @fission-ai/openspec@1.13.1 validate --changes --strict
          npx -y @fission-ai/openspec@1.13.1 validate --specs --strict
