# Cabeceras de seguridad equivalentes a vercel.json.
# Se incluyen en el server y en cada location que declara sus propios add_header
# (nginx no hereda add_header cuando el location define uno).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; connect-src 'self' https://va.vercel-scripts.com https://wapxgizdfvcynyextabx.supabase.co wss://wapxgizdfvcynyextabx.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
